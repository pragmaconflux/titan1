[build-system]
requires = ["setuptools>=82.0.1", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "titan-decoder"
dynamic = ["version"]
description = "Deterministic payload decoding and analysis engine — recursive decoding, forensic provenance, IOC extraction, detections, and analyst-oriented intelligence"
readme = "README.md"
license = "AGPL-3.0-or-later"
requires-python = ">=3.10"
authors = [
    { name = "PragmaConflux", email = "pragmaconflux@users.noreply.github.com" },
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Information Technology",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Security",
]
# Keep headless CLI and service installations dependency-light. The normal
# desktop install uses the desktop-ui extra documented in the README.
dependencies = []

[project.urls]
Documentation = "https://github.com/pragmaconflux/titan1/blob/main/docs/USAGE.md"
Source = "https://github.com/pragmaconflux/titan1"
Issues = "https://github.com/pragmaconflux/titan1/issues"

[project.scripts]
titan = "titan_decoder.launcher:main"

# Keep these lists in sync with requirements-dev.txt / requirements-optional.txt.
[project.optional-dependencies]
workbench-ui = [
    "textual>=0.89,<9",
]
desktop-ui = [
    "PySide6>=6.6,<7",
    "psutil>=5,<8",
]
formats = [
    "brotli>=1.1,<2",
    "zstandard>=0.23,<1",
    "py7zr>=1,<2",
    "rarfile>=4.2,<5",
    "pycdlib>=1.14,<2",
    "cabarchive>=0.2.5,<1",
]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.15.20",
    "mypy>=1.19.1",
    "pytest-cov>=5.0.0",
    "hypothesis>=6.100.0",
    "jsonschema>=4.20.0",
    "build>=1.5.0",
    "twine>=6.2.0",
    # twine needs packaging>=24.2 to validate the Metadata-2.4
    # License-Expression / License-File fields our SPDX license produces.
    "packaging>=24.2",
]
enrichment = [
    "psutil>=7.2.2",
    "geoip2>=5.2.0",
    "python-whois>=0.9.6",
    "yara-python>=4.5.4",
    "requests>=2.34.2",
    "PyYAML>=6.0.3",
]

[tool.setuptools.dynamic]
version = { attr = "titan_decoder.__version__" }

[tool.setuptools.packages.find]
include = ["titan_decoder*"]

[tool.setuptools.package-data]
"titan_decoder.threat_intel" = ["data/*.json"]
"titan_decoder.utils" = ["data/*.txt"]
"titan_decoder.desktop_ui" = ["assets/*.ico", "assets/*.png"]

[tool.mypy]
# Non-strict baseline (roadmap: "start non-strict, ratchet up"). Type errors
# block merge in CI for every module NOT on the ratchet list below. The intent
# is to tighten this over time: turn on stricter flags and remove modules from
# the ignore list as they are annotated.
python_version = "3.10"
ignore_missing_imports = true
no_implicit_optional = false
warn_unused_ignores = false
warn_return_any = false
check_untyped_defs = false
exclude = "(^|/)(tests|fuzz|tools)/"

# Ratchet list: legacy modules with pre-existing type errors. Each entry is a
# TODO to annotate and remove. New code must stay off this list.
[[tool.mypy.overrides]]
module = [
    "titan_decoder.core.analyzers.base",
    "titan_decoder.core.correlation",
    "titan_decoder.core.engine",
    "titan_decoder.core.graph_export",
    "titan_decoder.core.ioc_export",
    "titan_decoder.core.vault",
    "titan_decoder.plugins",
]
ignore_errors = true

[tool.ruff]
target-version = "py310"

[tool.ruff.lint]
# Ruff defaults (pyflakes + a pycodestyle-error subset). Kept intentionally
# conservative; broaden select once the codebase is ready for stricter rules.
select = ["E4", "E7", "E9", "F"]
