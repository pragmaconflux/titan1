name: Tests

on:
  push:
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install headless desktop runtime
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends --yes libegl1 libgl1

      - name: Install
        run: |
          python -m pip install --upgrade pip
          # Install every optional interface/format covered by committed tests
          # so the supported-version matrix cannot silently skip them.
          python -m pip install -e '.[workbench-ui,desktop-ui,formats]'
          python -m pip install pytest ruff mypy pytest-cov hypothesis jsonschema
          python -m pip install 'yara-python>=4.5.4'

      - name: Lint
        run: |
          ruff check .
          ruff format --check .

      - name: Type check (mypy)
        # Non-strict baseline; type errors block merge. See [tool.mypy] in
        # pyproject.toml for the ratchet list of legacy modules.
        run: |
          mypy titan_decoder/

      - name: Run tests with coverage floor
        # Coverage floor fails the build on regressions (current ~79%).
        run: |
          pytest -q --fail-on-skips --cov=titan_decoder --cov-report=term-missing --cov-fail-under=75

  windows-determinism:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install deterministic contract test runtime
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
          python -m pip install pytest hypothesis

      - name: Verify goldens, lineage, and legacy readers
        run: |
          python tools/golden.py --check
          pytest -q --fail-on-skips tests/test_golden_corpus.py tests/test_determinism_contracts.py tests/test_compatibility_contracts.py tests/test_supervised_analysis.py tests/test_supervised_deep_scan.py

  fuzz:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install
        run: |
          python -m pip install --upgrade pip
          # Proof calibration executes the optional compression decoders, and
          # the fuzz harness should exercise the same installed format set.
          python -m pip install -e '.[formats]'

      - name: Fuzz decoders/analyzers (bounded budget)
        # Time-bounded so CI stays fast; enforces the never-raise / bounded-
        # output / bounded-time invariants over random + corpus-derived inputs.
        run: |
          python fuzz/fuzz_decoders.py --seconds 60

      - name: Performance regression gate
        # Deterministic node counts checked exactly; wall-clock is normalized
        # against a calibration workload so a slow runner does not false-fail.
        run: |
          python tools/bench.py --check

      - name: Published proof bundle is current
        run: |
          python tools/publish_proof.py --check
